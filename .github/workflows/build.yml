name: Build DEB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install dpkg fakeroot ldid xz

      - name: Clone theos
        run: git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS

      - name: Fetch iOS SDK (sparse checkout, 只取一个 SDK)
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk iPhoneOS16.1.sdk iPhoneOS15.0.sdk
          for s in iPhoneOS16.5.sdk iPhoneOS16.1.sdk iPhoneOS15.0.sdk; do
            if [ -d "$s" ]; then cp -R "$s" "$THEOS/sdks/"; echo "USING_SDK=$s"; break; fi
          done
          ls -la $THEOS/sdks/
          [ "$(ls -A $THEOS/sdks)" ] || exit 1

      - name: Build dylib (arm64 + arm64e, 含 ldid 签名)
        run: |
          make || echo "stage/package 预期失败（fakeroot 与 arm64e 宿主冲突），编译与签名已完成"
          find .theos -name '*.dylib' -type f

      - name: Assemble rootless deb (手动打 deb，绕开 fakeroot 与 arm64e 宿主的冲突)
        run: |
          DYLIB=$(find .theos -name 'BarkAutoCopy.dylib' -type f | head -1)
          echo "DYLIB=$DYLIB"
          mkdir -p _deb/DEBIAN _deb/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp "$DYLIB" _deb/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp BarkAutoCopy.plist _deb/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp control _deb/DEBIAN/control
          mkdir -p dist
          dpkg-deb --root-owner-group -Zxz -b _deb dist/com.example.barkautocopy_0.0.1_iphoneos-arm64.deb
          ls -la dist/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarkAutoCopy-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BarkAutoCopy-deb
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
