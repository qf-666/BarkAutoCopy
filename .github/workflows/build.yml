name: Build DEB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install dpkg fakeroot ldid xz

      - name: Clone theos
        run: git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS

      - name: Fetch iOS SDK (sparse checkout, 只取一个 SDK)
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk iPhoneOS16.1.sdk iPhoneOS15.0.sdk
          for s in iPhoneOS16.5.sdk iPhoneOS16.1.sdk iPhoneOS15.0.sdk; do
            if [ -d "$s" ]; then cp -R "$s" "$THEOS/sdks/"; echo "USING_SDK=$s"; break; fi
          done
          ls -la $THEOS/sdks/
          [ "$(ls -A $THEOS/sdks)" ] || exit 1

      - name: Build package
        run: |
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarkAutoCopy-deb
          path: packages/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BarkAutoCopy-deb
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
